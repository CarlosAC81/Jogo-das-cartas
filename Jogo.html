<title>Conhecendo Você</title>

<style>
:root{--bg1:#fdf3dc;--bg2:#dceffb;--ink:#4a5f82;--muted:#6f7f9a;--btn:#9bdcc3;--btnink:#27504a;--edge:#cdd9df;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2c3547;--bg2:#263a4c;--ink:#f6efdc;--muted:#b9c5d8;--btn:#72c4a9;--btnink:#133530}}
:root[data-theme="dark"]{--bg1:#2c3547;--bg2:#263a4c;--ink:#f6efdc;--muted:#b9c5d8;--btn:#72c4a9;--btnink:#133530}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(165deg,var(--bg1),var(--bg2));color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;display:flex;padding:12px 16px;overflow-x:hidden;overflow-y:auto;text-align:center}
.deco{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.deco i{position:absolute;font-style:normal;opacity:.5;font-size:clamp(26px,5vh,44px);animation:fl 7s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-12px) rotate(6deg)}}
main{--w:min(80vw,400px,44vh);margin:auto;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.2vh,20px);position:relative;z-index:1;padding:8px 0}
h1{margin:0;font:800 clamp(34px,7vh,60px)/1 "Baloo 2","Nunito",sans-serif;text-shadow:0 2px 0 rgba(0,0,0,.08)}
.info{margin:0;color:var(--muted);font-weight:800;font-size:clamp(14px,2.3vh,18px)}
.scene{width:var(--w);height:calc(var(--w)*1.5);position:relative;perspective:1200px}
.layer,.card,.face{position:absolute;inset:0}

.layer{box-shadow:0 6px 14px rgba(60,70,90,.18)}
.l1{transform:translate(5px,7px) rotate(2deg)}
.l2{transform:translate(-5px,13px) rotate(-2.5deg)}
.card{border-radius:22px;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.45,.1,.2,1);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.card:not(.flip):hover{transform:translateY(-6px)}
.card.flip{transform:rotateY(180deg)}

.card.snap{transition:none}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;box-shadow:0 16px 30px rgba(60,70,90,.25),0 2px 5px rgba(60,70,90,.15)}
.front{transform:rotateY(180deg);background:#fffaf0;border:4px solid var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vh,16px);padding:11% 10%;color:#4a5f82}
.front::before{content:"";position:absolute;inset:8px;border:2.5px dotted #b8c8d1;border-radius:15px;pointer-events:none}
.badge{width:clamp(56px,9vh,84px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(30px,5vh,46px);box-shadow:inset 0 0 0 3px rgba(255,255,255,.75)}
.cat{font:800 clamp(13px,1.9vh,16px) "Nunito",sans-serif}
.q{margin:0;font:800 clamp(18px,3vh,26px)/1.3 "Nunito",sans-serif}
.ctl{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:6px}
.ctl.off{visibility:hidden}
.hint{margin:0;max-width:min(88vw,380px);color:var(--muted);font-weight:700;font-size:clamp(13px,2vh,16px)}
.btn{font:800 clamp(16px,2.6vh,20px) "Baloo 2","Nunito",sans-serif;background:var(--btn);color:var(--btnink);border:0;border-radius:999px;padding:.7em 1.7em;box-shadow:0 5px 0 rgba(0,0,0,.14),0 8px 16px rgba(0,0,0,.1);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.btn:focus-visible,.card:focus-visible{outline:3px solid #f2b705;outline-offset:4px}
.end{width:max(var(--w),290px);padding:28px 22px;border-radius:28px;background:#fffaf0;color:#4a5f82;border:4px solid var(--edge);box-shadow:0 16px 30px rgba(60,70,90,.22);display:flex;flex-direction:column;align-items:center;gap:12px}
.end .big{font-size:64px;line-height:1}
.end h2{margin:0;font:800 28px "Baloo 2","Nunito",sans-serif}
.end p{margin:0;font-weight:700}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.card,.card.leave{transition-duration:.01s}.deco i{animation:none}}
</style>
</head>
<body>
<div class="deco" aria-hidden="true">
<i style="left:5%;top:8%">☁️</i><i style="right:6%;top:6%">☀️</i><i style="left:8%;bottom:14%">⭐</i><i style="right:7%;bottom:30%">🌙</i><i style="right:14%;bottom:8%">🐝</i><i style="left:4%;top:45%">☁️</i>
</div>
<main>
<h1>Conhecendo Você</h1>
<p class="info" id="info">Toque no baralho para virar uma carta 🎈</p>
<div class="scene" id="scene">
<div class="layer back l2" id="l2"></div>
<div class="layer back l1" id="l1"></div>
<div class="card" id="card" role="button" tabindex="0" aria-label="Virar uma carta do baralho">
<div class="face back"></div>
<div class="face front">
<div class="badge" id="ic"></div>
<div class="cat" id="ct"></div>
<p class="q" id="q" aria-live="polite"></p>
</div>
</div>
</div>
<section class="end" id="end" hidden>
<div class="big">🎈</div>
<h2>Acabaram as cartas!</h2>
<p>Que conversa gostosa! Quer jogar mais uma rodada?</p>
<button class="btn" id="again">Embaralhar de novo</button>
</section>
<div class="ctl off" id="ctl">
<button class="btn" id="next">Próxima carta ➜</button>
<p class="hint">Primeiro a criança responde — depois a psicóloga responde também 💛</p>
</div>
</main>
<script>
const CATS={
"Gostos e preferências":["💛","#ffd6e0","#b04a68"],
"Imaginação":["🚀","#d3e8fb","#3b72a8"],
"Emoções e dia a dia":["🌈","#ffeeb0","#8a6a00"],
"Amizade, escola e descobertas":["🐝","#cdeedd","#2a7a5e"]};
const P={
"Gostos e preferências":[
"Qual é a sua comida favorita, que você comeria sem enjoar?",
"Se você pudesse escolher um filme, série ou desenho para maratonar hoje, qual seria?",
"Qual música ou estilo musical você mais gosta de ouvir ou dançar?",
"Qual é o seu lugar favorito para ficar quando quer relaxar ou se divertir?",
"Se você ganhasse um vale-presente surpresa, preferiria gastar em livros, roupas e acessórios, jogos ou doces?",
"O que você mais gosta de fazer no final de semana?"],
"Imaginação":[
"Se você pudesse ter um superpoder por um dia, qual seria e o que você faria logo de manhã?",
"Se você criasse um animal novo misturando dois animais que já existem, como ele seria e qual seria o nome dele?",
"Imagine que você achou uma porta secreta no seu quarto que leva para outro mundo. O que tem do outro lado?",
"Se você pudesse viajar no tempo, iria para o passado ou para o futuro? O que gostaria de ver?",
"Se você tivesse uma mochila mágica que nunca acaba, o que sempre estaria dentro dela?",
"Se você encontrasse um gênio da lâmpada, quais seriam os seus três desejos?",
"Invente um nome para um planeta novo que você descobriu. Como ele é?",
"Se você fosse um animal, qual você seria e por quê?"],
"Emoções e dia a dia":[
"O que costuma te deixar de bom humor rapidinho quando o dia começa meio pesado?",
"Quando algo dá errado ou te deixa irritada, o que você costuma fazer?",
"Qual foi uma coisa engraçada ou legal que aconteceu com você recentemente?",
"O que deixa você mais animada para um novo dia?",
"Quando você está com vergonha ou tímida, o que ajuda você a se sentir mais à vontade?"],
"Amizade, escola e descobertas":[
"O que você mais gosta de fazer com seus amigos ou com a sua família?",
"Se você pudesse inventar uma regra nova para a escola ou para as brincadeiras, qual seria?",
"Qual é uma coisa que você ainda não sabe fazer, mas teria vontade de aprender?",
"O que você acha que faz uma pessoa ser um bom amigo ou uma boa amiga?",
"Se você pudesse dar um conselho divertido para uma menina de 7 anos, o que diria?"]};
const CARTAS=Object.entries(P).flatMap(([categoria,qs])=>qs.map(pergunta=>({categoria,pergunta,icone:CATS[categoria][0]})));

const $=id=>document.getElementById(id);
const card=$("card"),info=$("info"),ctl=$("ctl"),nextB=$("next");
let deck=[],i=0,busy=false;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function shuffle(a){for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function pilha(){const r=deck.length-i;$("l1").hidden=r<2;$("l2").hidden=r<3}
function novo(){
  deck=shuffle(CARTAS.slice());i=0;busy=false;
  card.className="card";ctl.classList.add("off");
  $("end").hidden=true;$("scene").hidden=false;
  info.textContent="Toque no baralho para virar uma carta 🎈";
  pilha();
}
function fim(){
  $("scene").hidden=true;ctl.classList.add("off");$("end").hidden=false;
  info.textContent="Fim da rodada";busy=false;
}
async function sortear(){
  if(busy)return;busy=true;
  if(card.classList.contains("flip")){
    card.classList.add("leave");await wait(500);
    if(i>=deck.length){fim();return}
    card.className="card snap";void card.offsetWidth;card.classList.remove("snap");
    await wait(120);
  }
  const c=deck[i++],[,tint,cor]=CATS[c.categoria];
  $("ic").textContent=c.icone;$("ic").style.background=tint;
  $("ct").textContent=c.categoria;$("ct").style.color=cor;
  $("q").textContent=c.pergunta;
  pilha();
  card.classList.add("flip");
  info.textContent="Carta "+i+" de "+deck.length;
  ctl.classList.remove("off");
  nextB.textContent=i===deck.length?"Finalizar ✨":"Próxima carta ➜";
  await wait(700);busy=false;
}
card.onclick=()=>{if(!card.classList.contains("flip"))sortear()};
card.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();if(!card.classList.contains("flip"))sortear()}};
nextB.onclick=sortear;
$("again").onclick=novo;
novo();
</script>
</body>
</html>
